name: Build Custom Package

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: "applicationId baru"
        required: true
        default: "com.kirom.echomusic"
      variant:
        description: "Varian build"
        required: true
        default: "universalGmsRelease"
        type: choice
        options:
          - universalGmsRelease
          - universalFossRelease
          - arm64GmsRelease
          - arm64FossRelease
          - universalGmsDebug
          - universalFossDebug

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ inputs.variant }} (${{ inputs.package_name }})
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: Install NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;28.2.13676358"

      - name: Rename package (applicationId)
        env:
          PKG: ${{ inputs.package_name }}
        run: |
          set -e
          if ! echo "$PKG" | grep -Eq '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$'; then
            echo "Nama paket tidak valid: $PKG"; exit 1
          fi
          # Hanya applicationId yang diganti. namespace + package source tetap
          # (echo.music.iad1tya) supaya tidak perlu memindah ratusan file.
          sed -i "s|applicationId = \"echo.music.iad1tya\"|applicationId = \"$PKG\"|" app/build.gradle.kts
          # targetPackage di shortcut hardcoded, harus sama dengan applicationId
          sed -i "s|android:targetPackage=\"echo.music.iad1tya\"|android:targetPackage=\"$PKG\"|g" app/src/main/res/xml/shortcuts.xml
          grep -n 'applicationId\|namespace' app/build.gradle.kts
          grep -n 'targetPackage' app/src/main/res/xml/shortcuts.xml

      - name: Prepare keystore (dipakai Gradle untuk release)
        run: |
          keytool -genkeypair -keystore keystore.jks -storepass ciStore123 \
            -alias ci -keypass ciStore123 -dname "CN=CI,O=CI,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000
          {
            echo "STORE_PASSWORD=ciStore123"
            echo "KEY_ALIAS=ci"
            echo "KEY_PASSWORD=ciStore123"
          } >> "$GITHUB_ENV"
          # debug keystore untuk varian Debug
          mkdir -p "$HOME/.android"
          [ -f "$HOME/.android/debug.keystore" ] || keytool -genkeypair \
            -keystore "$HOME/.android/debug.keystore" -storepass android \
            -alias androiddebugkey -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -validity 10000

      - name: Build
        env:
          VARIANT: ${{ inputs.variant }}
        run: |
          chmod +x gradlew
          ./gradlew "assemble${VARIANT^}" --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"

      - name: Re-sign dengan testkey AOSP
        run: |
          set -e
          mkdir -p dist
          APKS=$(find app/build/outputs/apk -name '*.apk' ! -name '*-unaligned*')
          echo "$APKS"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          B=https://android.googlesource.com/platform/build/+/refs/heads/main/target/product/security
          if curl -fsSL "$B/testkey.pk8?format=TEXT" | base64 -d > testkey.pk8 \
             && curl -fsSL "$B/testkey.x509.pem?format=TEXT" | base64 -d > testkey.x509.pem \
             && [ -s testkey.pk8 ] && grep -q BEGIN testkey.x509.pem; then
            for f in $APKS; do
              "$BT/apksigner" sign --key testkey.pk8 --cert testkey.x509.pem \
                --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
                --out "dist/$(basename "$f")" "$f"
            done
            echo "SIGNED_WITH=AOSP testkey" >> "$GITHUB_ENV"
          else
            echo "::warning::Gagal ambil testkey AOSP, pakai tanda tangan keystore CI"
            for f in $APKS; do cp "$f" "dist/$(basename "$f")"; done
            echo "SIGNED_WITH=keystore CI (testkey gagal diunduh)" >> "$GITHUB_ENV"
          fi

      - name: Verifikasi hasil
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          for f in dist/*.apk; do
            echo "== $f"
            "$BT/apksigner" verify --verbose --print-certs "$f" | head -8
            "$BT/aapt2" dump badging "$f" | grep -E "^package:|application-label:"
          done
          {
            echo "### Hasil build"
            echo "- Paket: \`${{ inputs.package_name }}\`"
            echo "- Varian: \`${{ inputs.variant }}\`"
            echo "- Signing: $SIGNED_WITH"
            ls -lh dist | sed 's/^/    /'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: Echo-Music-${{ inputs.package_name }}
          path: dist/*.apk
